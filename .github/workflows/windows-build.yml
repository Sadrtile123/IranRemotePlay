name: windows-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6 (MSVC 2022 64-bit)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          arch: 'win64_msvc2022_64'
          cache: 'true'

      - name: Configure (MSVC, VS 2022 generator)
        shell: pwsh
        run: |
          $qtRoot = (Get-Item $env:Qt6_DIR).Parent.Parent.Parent.FullName
          Write-Host "Qt root: $qtRoot"
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_PREFIX_PATH=$qtRoot"

      - name: Build (Release)
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemotePlay-windows-x64
          path: |
            build/bin/Release/*.exe
          if-no-files-found: error
