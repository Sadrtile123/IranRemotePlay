name: windows-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Qt installed via aqtinstall directly (deterministic, no third-party
      # action runtime involved).
      - name: Install Qt 6.8.1 (MSVC 2022 64-bit)
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall
          python -m aqt install-qt windows desktop 6.8.1 win64_msvc2022_64 -O "$env:RUNNER_TEMP\Qt"

      - name: Locate Qt root
        id: qt
        shell: pwsh
        run: |
          $cfg = Get-ChildItem -Recurse -Filter Qt6Config.cmake "$env:RUNNER_TEMP\Qt" |
                 Select-Object -First 1
          if (-not $cfg) { Write-Error "Qt6Config.cmake not found"; exit 1 }
          $qtRoot = $cfg.Directory.Parent.Parent.Parent.FullName
          Write-Host "Qt root: $qtRoot"
          "prefix=$qtRoot" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8

      # Self-contained MSVC build: locate VS via vswhere, enter the x64
      # environment, then configure/build/test with Ninja in one cmd session.
      - name: Configure, build, test (MSVC x64 + Ninja)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { Write-Error "vswhere.exe not found"; exit 1 }
          $vsPath = & $vswhere -latest -products * `
                    -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                    -property installationPath
          if (-not $vsPath) { Write-Error "No VS instance with C++ tools found"; exit 1 }
          Write-Host "Visual Studio: $vsPath"
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { Write-Error "vcvars64.bat not found"; exit 1 }

          $qtPrefix = "${{ steps.qt.outputs.prefix }}"
          $cmd = "`"$vcvars`" && " +
                 "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release " +
                 "`"-DCMAKE_PREFIX_PATH=$qtPrefix`" && " +
                 "cmake --build build --parallel && " +
                 "ctest --test-dir build --output-on-failure"
          cmd /d /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemotePlay-windows-x64
          path: build/bin/*.exe
          if-no-files-found: error
